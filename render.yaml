# Render Blueprint: connect the GitHub repo once and every push to main redeploys.
# Secrets are left blank on purpose: enter them in the Render dashboard, never in this file.
services:
  - type: web
    name: sahayak
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: INPROCESS_MOCK
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: META_WA_TOKEN
        sync: false
      - key: META_PHONE_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: ACCESS_KEY
        sync: false
      - key: WHATSAPP_LINKS
        sync: false
